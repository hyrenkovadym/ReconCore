name: reconcore

services:
  postgres:
    image: postgres:16-alpine
    container_name: reconcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reconcore}
      POSTGRES_USER: ${POSTGRES_USER:-reconcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconcore}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconcore} -d ${POSTGRES_DB:-reconcore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: reconcore-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-reconcore}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-reconcore}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: reconcore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: reconcore-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-reconcore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-reconcore}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: reconcore-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-ReconCore API}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      POSTGRES_DB: ${POSTGRES_DB:-reconcore}
      POSTGRES_USER: ${POSTGRES_USER:-reconcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconcore}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-reconcore}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-reconcore}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-reconcore_raw}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-reconcore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-reconcore}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://reconcore:reconcore@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-reconcore-dev-bucket}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: reconcore-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-ReconCore API}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      POSTGRES_DB: ${POSTGRES_DB:-reconcore}
      POSTGRES_USER: ${POSTGRES_USER:-reconcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconcore}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-reconcore}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-reconcore}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-reconcore_raw}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-reconcore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-reconcore}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://reconcore:reconcore@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-reconcore-dev-bucket}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    container_name: reconcore-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-ReconCore API}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      POSTGRES_DB: ${POSTGRES_DB:-reconcore}
      POSTGRES_USER: ${POSTGRES_USER:-reconcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconcore}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-reconcore}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-reconcore}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-reconcore_raw}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-reconcore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-reconcore}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://reconcore:reconcore@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-reconcore-dev-bucket}
    volumes:
      - ./backend:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: reconcore-frontend
    restart: unless-stopped
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
